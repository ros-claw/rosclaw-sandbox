[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosclaw-sandbox"
version = "0.1.0"
description = "ROSClaw Sandbox — embodied physics simulation, validation, replay, and safety-gating layer"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ROSClaw Team", email = "team@rosclaw.io"},
]
keywords = ["robotics", "mujoco", "simulation", "safety", "embodied-ai", "firewall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
mujoco = [
    "mujoco>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
export = [
    "mcap>=1.0.0",
    "opencv-python>=4.8.0",
]
all = [
    "rosclaw-sandbox[mujoco,dev,export]",
]

[project.scripts]
rosclaw-sandbox = "rosclaw.sandbox.cli.main:app"

[project.urls]
Homepage = "https://rosclaw.io"
Repository = "https://github.com/ros-claw/rosclaw-sandbox"

[tool.hatch.build.targets.wheel]
packages = ["src/rosclaw"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["rosclaw"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
